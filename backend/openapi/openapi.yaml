openapi: 3.0.3
info:
  title: 智能墨水屏平台 API
  version: 1.0.0
  description: |
    用户端/管理端/设备端统一接口文档。
    设备（真机与模拟）推荐统一启动链路：login -> auto-register -> bind/status -> login -> stream。
servers:
  - url: /

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: ok
        data:
          nullable: true
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string }
        nickname: { type: string }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        deviceCount: { type: integer }
    TfFile:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        category: { type: string }
        name: { type: string }
        originalName: { type: string }
        size: { type: integer }
        mime: { type: string }
        sha256: { type: string }
        gridId: { type: string }
        url: { type: string }
        deliverStatus:
          type: string
          description: pending|delivered
        createdAt: { type: string }
        updatedAt: { type: string }
    Device:
      type: object
      properties:
        id:
          type: string
          example: dev_xxx
        mac:
          type: string
          example: AA:BB:CC:DD:EE:FF
        ownerId:
          type: string
        type:
          type: string
        remark:
          type: string
        status:
          type: string
        simulated:
          type: boolean
        firmwareVersion:
          type: string
        apiKeys:
          type: object
          additionalProperties:
            type: string
        bindState:
          type: string
          example: bound
        boundAt:
          type: string
        boundBy:
          type: string
        lastLoginAt:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    Todo:
      type: object
      properties:
        id: { type: string }
        deviceId: { type: string }
        content: { type: string }
        done: { type: boolean }
        priority: { type: integer, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
    Schedule:
      type: object
      properties:
        id: { type: string }
        deviceId: { type: string }
        mode: { type: string }
        weekday: { type: integer }
        orderIndex: { type: integer }
        title: { type: string }
        content: { type: string }
        courseName: { type: string }
        note: { type: string }
        source: { type: string }
        sourceKey: { type: string }
        termKey: { type: string }
        xiqueCourseId: { type: string }
        xiqueClassKey: { type: string }
        sourceMeta: { type: object }
        createdAt: { type: string }
        updatedAt: { type: string }
    XiqueScheduleConfig:
      type: object
      properties:
        id: { type: string }
        deviceId: { type: string }
        source: { type: string, example: xique }
        enabled: { type: boolean }
        intervalMinutes:
          type: integer
          enum: [10, 30, 60]
        currentTermKey: { type: string }
        adapterMode: { type: string, example: mock }
        baseUrl: { type: string }
        sampleUrl: { type: string }
        sampleHtml: { type: string }
        requireCaptcha: { type: boolean }
        needCaptchaReverify: { type: boolean }
        paused: { type: boolean }
        pauseReason: { type: string }
        pauseUntil: { type: string }
        failureCount: { type: integer }
        lastAttemptAt: { type: string }
        lastSuccessAt: { type: string }
        lastError: { type: string }
        nextRunAt: { type: string }
        loginUsername: { type: string }
        loginDisplayName: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    XiqueVault:
      type: object
      properties:
        id: { type: string }
        configId: { type: string }
        deviceId: { type: string }
        state: { type: string }
        sessionId: { type: string }
        sessionExpiresAt: { type: string }
        captchaSession: { type: string }
        captchaImage: { type: string }
        captchaExpiresAt: { type: string }
        needCaptchaReverify: { type: boolean }
        lastVerifiedAt: { type: string }
        lastLoginAt: { type: string }
        lastError: { type: string }
        hasCredential: { type: boolean }
        hasSession: { type: boolean }
    XiqueStatus:
      type: object
      properties:
        deviceId: { type: string }
        config: { $ref: '#/components/schemas/XiqueScheduleConfig' }
        session: { $ref: '#/components/schemas/XiqueVault' }
        logs:
          type: array
          items: { type: object }
    XiqueLoginResponse:
      type: object
      properties:
        deviceId: { type: string }
        configId: { type: string }
        loginRequired: { type: boolean }
        captchaRequired: { type: boolean }
        captchaSession: { type: string }
        captchaImage: { type: string }
        captchaExpiresAt: { type: string }
    XiqueImportResponse:
      type: object
      properties:
        status: { type: string }
        deviceId: { type: string }
        configId: { type: string }
        termKey: { type: string }
        nextRunAt: { type: string }
        result:
          type: object
          properties:
            added: { type: integer }
            updated: { type: integer }
            skipped: { type: integer }
            overwritten: { type: integer }
            imported: { type: integer }
    Template:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        method: { type: string }
        url: { type: string }
        keyField: { type: string }
        keyIn:
          type: array
          items: { type: string }
        deviceKeyRequired: { type: boolean }
        enabled: { type: boolean }
        advancedEnabled: { type: boolean }
        advancedConfig: { type: object }
    Firmware:
      type: object
      properties:
        id: { type: string }
        version: { type: string }
        releaseNote: { type: string }
        deviceType: { type: string }
        fileName: { type: string }
        fileUrl: { type: string }
        gridId: { type: string }
        fileSize: { type: integer }
        mime: { type: string }
        sha256: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    UpgradeJob:
      type: object
      properties:
        id: { type: string }
        deviceId: { type: string }
        firmwareId: { type: string }
        status: { type: string }
        progress: { type: integer }
        scheduledAt: { type: string }
        createdAt: { type: string }
        finishedAt: { type: string }
        force: { type: boolean }
        result: { type: string }
        createdBy:
          type: object
          properties:
            role: { type: string }
            id: { type: string }
    Cluster:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        rule: { type: string }
        deviceIds:
          type: array
          items: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    OperationLog:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        status: { type: string }
        actorId: { type: string }
        actorRole: { type: string }
        detail: { type: object }
        createdAt: { type: string }
    ApiLog:
      type: object
      properties:
        id: { type: string }
        templateSlug: { type: string }
        deviceId: { type: string }
        callerRole: { type: string }
        callerId: { type: string }
        success: { type: boolean }
        statusCode: { type: integer }
        latencyMs: { type: integer }
        error: { type: string }
        createdAt: { type: string }
    AutoRegisterResponse:
      oneOf:
        - type: object
          properties:
            mode: { type: string, example: pending_bind }
            deprecated: { type: boolean }
            warnings:
              type: array
              items: { type: string }
            device: { $ref: '#/components/schemas/Device' }
            bind:
              type: object
              properties:
                pin: { type: string }
                expiresAt: { type: string }
                ttlSeconds: { type: integer }
                attemptsLeft: { type: integer }
            bootstrap:
              type: object
              properties:
                token: { type: string }
                expiresAt: { type: string }
        - type: object
          properties:
            mode: { type: string, example: already_bound }
            deprecated: { type: boolean }
            warnings:
              type: array
              items: { type: string }
            device: { $ref: '#/components/schemas/Device' }
            hardwareAuth:
              type: object
              properties:
                token: { type: string }
                templates:
                  type: array
                  items: { type: object }
    BindStatus:
      oneOf:
        - type: object
          properties:
            bound: { type: boolean, example: true }
            device: { $ref: '#/components/schemas/Device' }
            hardwareAuth:
              type: object
              properties:
                token: { type: string }
                templates:
                  type: array
                  items: { type: object }
        - type: object
          properties:
            bound: { type: boolean, example: false }
            pinExpiresAt: { type: string }
            attemptsLeft: { type: integer }

paths:
  /api/health:
    get:
      summary: 健康检查
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/auth/user/login:
    post:
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/auth/admin/login:
    post:
      summary: 管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/auth/me:
    get:
      summary: 当前用户信息
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/auth/logout:
    post:
      summary: 退出登录
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: ok

  /api/auth/change-password:
    post:
      summary: 修改密码
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: ok

  /api/admin/users:
    get:
      summary: 管理员获取用户列表
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: role
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: keyword
          schema: { type: string }
      responses:
        '200':
          description: ok
    post:
      summary: 管理员创建账号
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                role: { type: string }
                nickname: { type: string }
      responses:
        '200':
          description: ok

  /api/admin/users/{userId}:
    post:
      summary: 管理员更新账号
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string }
                status: { type: string }
                role: { type: string }
                password: { type: string }
      responses:
        '200':
          description: ok

  /api/admin/users/{userId}/resources:
    post:
      summary: 管理员处理账号绑定资源
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string }
                targetUserId: { type: string }
      responses:
        '200':
          description: ok

  /api/admin/users/{userId}/delete:
    post:
      summary: 管理员删除账号
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string }
      responses:
        '200':
          description: ok

  /api/admin/dashboard:
    get:
      summary: 系统概览
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: ok

  /api/clusters:
    get:
      summary: 集群列表
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: ok
    post:
      summary: 新增集群
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                rule: { type: string }
                deviceIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: ok

  /api/clusters/{clusterId}:
    post:
      summary: 更新集群
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: clusterId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: ok

  /api/clusters/{clusterId}/devices:
    post:
      summary: 管理集群设备
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: clusterId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceIds: { type: array, items: { type: string } }
                mode: { type: string, example: append }
      responses:
        '200':
          description: ok

  /api/clusters/{clusterId}/delete:
    post:
      summary: 删除集群
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: clusterId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok

  /api/devices:
    get:
      summary: 设备列表
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: mac
          schema: { type: string }
        - in: query
          name: ownerId
          description: 管理员可用
          schema: { type: string }
        - in: query
          name: simulated
          schema: { type: string }
        - in: query
          name: bound
          schema: { type: string }
      responses:
        '200':
          description: ok

  /api/devices/register:
    post:
      summary: 管理员手工注册设备（兼容接口）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mac: { type: string }
                ownerId: { type: string }
                type: { type: string }
                remark: { type: string }
      responses:
        '200':
          description: ok

  /api/devices/bind-pin:
    post:
      summary: 绑定PIN设备
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string }
                ownerId: { type: string }
      responses:
        '200':
          description: ok

  /api/devices/{deviceId}:
    get:
      summary: 设备详情
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
    post:
      summary: 更新设备
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: ok

  /api/devices/{deviceId}/delete:
    post:
      summary: 删除设备
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok

  /api/devices/{deviceId}/keys:
    get:
      summary: 设备密钥
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
    post:
      summary: 更新设备密钥
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keys: { type: object }
      responses:
        '200':
          description: ok

  /api/devices/batch/config:
    post:
      summary: 批量下发Key配置
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceIds: { type: array, items: { type: string } }
                clusterIds: { type: array, items: { type: string } }
                keys: { type: object }
      responses:
        '200':
          description: ok

  /api/devices/batch/third-params:
    post:
      summary: 批量下发第三方参数
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceIds: { type: array, items: { type: string } }
                clusterIds: { type: array, items: { type: string } }
                slug: { type: string }
                params: { type: object }
      responses:
        '200':
          description: ok

  /api/templates:
    get:
      summary: 模板列表
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: ok
    post:
      summary: 新增模板
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
      responses:
        '200':
          description: ok

  /api/templates/{templateId}:
    post:
      summary: 更新模板
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: templateId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: ok

  /api/templates/{templateId}/delete:
    post:
      summary: 删除模板
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: templateId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok

  /api/templates/device/{deviceId}/keys:
    get:
      summary: 获取设备全部Key
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
    post:
      summary: 覆盖更新设备全部Key
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keys: { type: object }
      responses:
        '200':
          description: ok

  /api/todos:
    get:
      summary: TODO列表
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
        - in: query
          name: done
          schema: { type: string }
        - in: query
          name: orderBy
          schema: { type: string }
        - in: query
          name: order
          schema: { type: string }
      responses:
        '200':
          description: ok
    post:
      summary: 新增TODO
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Todo' }
      responses:
        '200':
          description: ok

  /api/todos/{todoId}:
    post:
      summary: 更新TODO
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: todoId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: ok

  /api/todos/{todoId}/delete:
    post:
      summary: 删除TODO
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: todoId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok

  /api/todos/batch-upsert:
    post:
      summary: TODO批量保存
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: { type: string }
                rows: { type: array, items: { $ref: '#/components/schemas/Todo' } }
                deletedIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: ok

  /api/todos/batch-delete:
    post:
      summary: TODO批量删除
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: ok

  /api/schedules:
    get:
      summary: 课程表列表
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: deviceId
          schema: { type: string }
      responses:
        '200':
          description: ok
    post:
      summary: 新增课程
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Schedule' }
      responses:
        '200':
          description: ok

  /api/schedules/{scheduleId}:
    post:
      summary: 更新课程
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: ok

