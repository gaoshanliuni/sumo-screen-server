name: Import clean source snapshot

on:
  push:
    paths:
      - 'source/import-ready.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify clean source snapshot
        run: |
          cat source/sumo-core-source.tar.zst.b64.part-* > /tmp/sumo-core-source.tar.zst.b64
          base64 --decode /tmp/sumo-core-source.tar.zst.b64 > /tmp/sumo-core-source.tar.zst
          echo "e2f78b0180643c313c0f3668d1d25de2c84e60dd80ae8fa8f66e8a8308da48d8  /tmp/sumo-core-source.tar.zst" | sha256sum --check --strict

      - name: Extract source tree
        run: |
          zstd -d -c /tmp/sumo-core-source.tar.zst | tar -x -C .

      - name: Remove import transport files
        run: |
          rm -rf source

      - name: Commit expanded source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import 素墨屏语 source tree"
          git push
