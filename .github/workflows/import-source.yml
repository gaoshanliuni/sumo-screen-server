name: Import clean source snapshot

on:
  push:
    paths:
      - 'source/sumo-core-source.tar.zst.b64.part-*'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify clean source snapshot
        run: |
          cat source/sumo-core-source.tar.zst.b64.part-* > /tmp/sumo-core-source.tar.zst.b64
          base64 --decode /tmp/sumo-core-source.tar.zst.b64 > /tmp/sumo-core-source.tar.zst
          echo "ced42c9943d747dd84304aa34b3b5994da156e2f617b576c02ab79c465b04f7b  /tmp/sumo-core-source.tar.zst" | sha256sum --check --strict

      - name: Extract source tree
        run: |
          zstd -d -c /tmp/sumo-core-source.tar.zst | tar -x -C .

      - name: Commit expanded source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import 素墨屏语 source tree"
          git push
