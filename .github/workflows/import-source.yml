name: Import clean source snapshot

on:
  push:
    paths:
      - 'source/import-ready.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify clean source snapshot
        run: |
          base64 --decode source/sumo-core-source.tar.xz.b64 > /tmp/sumo-core-source.tar.xz
          echo "15d8ec1d4a08eaf7633c2d65a500050320b3d0340d0f6fdca0b279f88314c078  /tmp/sumo-core-source.tar.xz" | sha256sum --check --strict

      - name: Extract source tree
        run: |
          tar -xJf /tmp/sumo-core-source.tar.xz -C .

      - name: Remove import transport files
        run: |
          rm -rf source

      - name: Commit expanded source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import 素墨屏语 source tree"
          git push
